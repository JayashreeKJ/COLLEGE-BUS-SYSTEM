# ===================================================================
# Render Blueprint Specification (Infrastructure-as-Code)
# Documentation: https://render.com/docs/blueprint-spec
# ===================================================================

services:
  # Backend Web Service (Spring Boot REST API)
  - type: web
    name: smartbus-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: CORS_ALLOWED_ORIGINS
        value: https://college-bus-system.vercel.app,http://localhost:5173
      - key: HIBERNATE_DDL_AUTO
        value: update
      - key: JWT_SECRET
        generateValue: true
      # Link to the managed Render PostgreSQL database below (or replace with cloud MySQL)
      - key: DATABASE_URL
        fromDatabase:
          name: smartbus-db
          property: connectionString

databases:
  # Managed PostgreSQL Database on Render (Free tier)
  - name: smartbus-db
    plan: free
    region: oregon
    databaseName: smartbus_db
    user: smartbus_user
