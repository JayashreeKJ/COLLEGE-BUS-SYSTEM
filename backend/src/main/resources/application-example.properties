# ===================================================================
# SmartBus Spring Boot Configuration Template (Example)
# Copy this file to application-local.properties or set environment variables.
# ===================================================================

# Server Port
PORT=8080

# Database Configuration
DB_URL=jdbc:mysql://localhost:3306/smartbus_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
DB_HOST=localhost
DB_PORT=3306
DB_NAME=smartbus_db
DB_USERNAME=root
DB_PASSWORD=your_mysql_password_here

# Hibernate Schema Auto Generation (update, validate, none)
HIBERNATE_DDL_AUTO=update

# JWT Security
JWT_SECRET=your_jwt_secret_key_minimum_256_bits_for_hmac_sha256_security
JWT_EXPIRATION_MS=86400000
