# ===================================================================
# SmartBus Spring Boot Configuration
# ===================================================================
spring.application.name=smartbus-backend
server.port=${PORT:8080}

# Database Connection (Environment Variable Driven: DB_URL, DB_USERNAME, DB_PASSWORD, or Render DATABASE_URL)
# Defaults to localhost MySQL for local development if DB_URL is not set
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smartbus_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA & Hibernate Configurations (Hibernate automatically auto-detects dialect for MySQL, PostgreSQL, or H2)
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# CORS Configuration (Allows Vercel frontend, local dev, or custom domain via CORS_ALLOWED_ORIGINS)
smartbus.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://college-bus-system.vercel.app}

# JWT Configuration
smartbus.jwt.secret=${JWT_SECRET:smartbusSuperSecretKeyForCollegeProjectTransitSystemTracking2026Secure}
smartbus.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.com.smartbus=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
