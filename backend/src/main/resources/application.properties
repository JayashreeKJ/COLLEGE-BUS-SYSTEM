# ===================================================================
# SmartBus Spring Boot Configuration
# ===================================================================
spring.application.name=smartbus-backend
server.port=${PORT:8080}

# Database Connection (Environment Variable Driven: DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smartbus_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configurations
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
smartbus.jwt.secret=${JWT_SECRET:smartbusSuperSecretKeyForCollegeProjectTransitSystemTracking2026Secure}
smartbus.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.com.smartbus=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
